services:
  web-service:
    container_name: web-service
    build: .
    ports: 
      - "8080:8080"
    volumes:
      - type: bind
        source: ${CATEGORIES_CONFIG_PATH}
        target: /app/config
    restart: unless-stopped
    depends_on: 
      - mongodb
      - ollama
  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubi8-slim
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama: